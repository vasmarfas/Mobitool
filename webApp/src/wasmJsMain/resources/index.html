                        received += step.value.byteLength;
                        var share = Math.min(1, received / expected);
                        fill.style.transform = "scaleX(" + share.toFixed(3) + ")";
                        if (share >= 1) setLoad("starting");
                        return reader.read().then(count);
                    }).catch(function () {});
                    return response;
                });
            };
        }
        var s = document.createElement("script");
        s.src = "app.js";
        s.type = "application/javascript";
        s.onerror = function () { setLoad("failed"); };
        document.body.appendChild(s);
    })();
</script>
</body>
</html>
