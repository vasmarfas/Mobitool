name: Publish Microsoft Store
run-name: Publish Microsoft Store from run ${{ inputs.run_id || github.run_id }}

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'ID of the Deploy Desktop or Release run with the msix-windows artifact (the number in the run URL)'
        required: true
      submit:
        description: 'Send the submission to certification (off = leave it as a draft)'
        type: boolean
        default: true
  workflow_call:
    inputs:
      run_id:
        type: string
        required: false
        default: ''
      submit:
        type: boolean
        required: false
        default: true

permissions:
  actions: read
  contents: read

concurrency:
  group: publish-microsoft-store
  cancel-in-progress: false

jobs:
  publish:
    name: Partner Center submission
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check credentials
        id: guard
        env:
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          MS_STORE_APP_ID: ${{ secrets.MS_STORE_APP_ID }}
          MS_SELLER_ID: ${{ secrets.MS_SELLER_ID }}
        run: |
          set -eu
          if [ -z "${MS_TENANT_ID:-}" ] || [ -z "${MS_CLIENT_ID:-}" ] || [ -z "${MS_CLIENT_SECRET:-}" ] ||
             [ -z "${MS_STORE_APP_ID:-}" ] || [ -z "${MS_SELLER_ID:-}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::MS_TENANT_ID / MS_CLIENT_ID / MS_CLIENT_SECRET / MS_STORE_APP_ID / MS_SELLER_ID are not set, skipping the Microsoft Store"
            echo 'Microsoft Store: skipped, secrets are not set.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Download MSIX
        if: steps.guard.outputs.ready == 'true'
        uses: actions/download-artifact@v8
        with:
          name: msix-windows
          path: msix
          run-id: ${{ inputs.run_id }}
          github-token: ${{ inputs.run_id && github.token || '' }}

      - name: Set up the Microsoft Store CLI
        if: steps.guard.outputs.ready == 'true'
        uses: microsoft/microsoft-store-apppublisher@v1.1

      - name: Submit
        if: steps.guard.outputs.ready == 'true'
        env:
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          MS_STORE_APP_ID: ${{ secrets.MS_STORE_APP_ID }}
          MS_SELLER_ID: ${{ secrets.MS_SELLER_ID }}
          SUBMIT: ${{ inputs.submit }}
        run: |
          set -eu
          msstore reconfigure --tenantId "$MS_TENANT_ID" --sellerId "$MS_SELLER_ID" \
            --clientId "$MS_CLIENT_ID" --clientSecret "$MS_CLIENT_SECRET"
          set -- msix/*.msix
          if [ "$SUBMIT" = 'true' ]; then
            msstore publish "$1" --appId "$MS_STORE_APP_ID"
            echo "Microsoft Store: $(basename "$1") sent to certification." >> "$GITHUB_STEP_SUMMARY"
          else
            msstore publish "$1" --appId "$MS_STORE_APP_ID" --noCommit
            echo "Microsoft Store: $(basename "$1") uploaded, the submission is left as a draft." >> "$GITHUB_STEP_SUMMARY"
          fi
