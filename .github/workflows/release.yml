name: Release
run-name: Release ${{ inputs.version_name }}

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version (e.g. 1.1.0, 1.2.0-rc1)'
        required: true
      notes_en:
        description: 'What''s new in English: Google Play, App Store, Mac App Store, GitHub. \n is a line break, Google Play takes up to 500 characters'
        required: true
      notes_ru:
        description: 'Что нового по-русски: Google Play, RuStore, App Store, Mac App Store, GitHub. \n — перенос строки, Google Play берёт до 500 знаков'
        required: true
      submit_for_review:
        description: 'Send to review in every store (unchecked = upload and leave the versions ready in the consoles)'
        type: boolean
        default: true
      release_after_review:
        description: 'Publish as soon as review passes: App Store, Mac App Store, RuStore (Google Play follows its managed publishing setting)'
        type: boolean
        default: true
      play_track:
        description: 'Google Play track'
        type: choice
        options: [production, beta, alpha, internal]
        default: production
      publish_google_play:
        description: 'Google Play'
        type: boolean
        default: true
      publish_rustore:
        description: 'RuStore'
        type: boolean
        default: true
      publish_app_store:
        description: 'App Store (iOS)'
        type: boolean
        default: true
      publish_mac_app_store:
        description: 'Mac App Store'
        type: boolean
        default: true
      deploy_web:
        description: 'Deploy the site to vasmarfas.com and vasmarfas.ru'
        type: boolean
        default: true
      draft:
        description: 'Leave the GitHub release as a draft'
        type: boolean
        default: false
      version_code:
        description: 'Android versionCode and Apple build number (empty = from the version, 1.4.12 is 1041299, 1.4.12-rc2 is 1041202)'
        required: false
        default: ''

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    name: Release parameters
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.resolve.outputs.version_name }}
      version_code: ${{ steps.resolve.outputs.version_code }}
    steps:
      # the stores get the build without a second test run, so the commit must already be green in CI
      - name: Check CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA" \
            --jq '.workflow_runs[0] // {} | "\(.status // "") \(.conclusion // "")"')
          case "$run" in
            'completed success') ;;
            ' ') echo "::warning::CI has not run on $GITHUB_SHA, releasing without it" ;;
            completed*) echo "::error::CI ended with '${run#completed }' on $GITHUB_SHA"; exit 1 ;;
            *) echo "::error::CI is still running on $GITHUB_SHA, start the release after it finishes"; exit 1 ;;
          esac

      - name: Resolve
        id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version_name }}
          INPUT_CODE: ${{ inputs.version_code }}
        run: |
          set -eu
          derived=$(printf '%s' "$INPUT_VERSION" | awk '{
            split($0, part, "-")
            split(part[1], v, ".")
            stage = 99
            if (index($0, "-")) { stage = 0; if (match($0, /[0-9]+$/)) stage = substr($0, RSTART) }
            print ((v[1] * 100 + v[2]) * 100 + v[3]) * 100 + stage
          }')
          {
            echo "version_name=$INPUT_VERSION"
            echo "version_code=${INPUT_CODE:-$derived}"
          } >> "$GITHUB_OUTPUT"

      # a long text would fail Google Play after the other stores already took the build
      - name: Check release notes
        if: inputs.publish_google_play
        env:
          NOTES_EN: ${{ inputs.notes_en }}
          NOTES_RU: ${{ inputs.notes_ru }}
        run: |
          set -eu
          for name in NOTES_EN NOTES_RU; do
            length=$(printf '%b' "${!name}" | LC_ALL=C.UTF-8 wc -m)
            if [ "$length" -gt 500 ]; then
              echo "::error::$name is $length characters, Google Play takes up to 500"
              exit 1
            fi
          done

      - name: Compose GitHub release notes
        env:
          NOTES_EN: ${{ inputs.notes_en }}
          NOTES_RU: ${{ inputs.notes_ru }}
        run: |
          set -eu
          {
            printf '%b\n\n' "$NOTES_EN"
            printf '%b\n' "$NOTES_RU"
          } > notes.md
          cat notes.md

      - name: Upload release notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: notes.md

  web:
    name: Web
    needs: meta
    uses: ./.github/workflows/deploy_web.yml
    with:
      version_name: ${{ needs.meta.outputs.version_name }}
      deploy_pages: ${{ inputs.deploy_web }}
      deploy_s3: ${{ inputs.deploy_web }}
    secrets: inherit

  android:
    name: Android
    needs: meta
    uses: ./.github/workflows/deploy_android.yml
    with:
      version_name: ${{ needs.meta.outputs.version_name }}
      version_code: ${{ needs.meta.outputs.version_code }}
      notes_en: ${{ inputs.notes_en }}
      notes_ru: ${{ inputs.notes_ru }}
      publish_google_play: ${{ inputs.publish_google_play }}
      play_track: ${{ inputs.play_track }}
      play_status: completed
      play_send_for_review: ${{ inputs.submit_for_review }}
      publish_rustore: ${{ inputs.publish_rustore }}
      rustore_artifact: apk
      rustore_submit: ${{ inputs.submit_for_review }}
      rustore_auto_publish: ${{ inputs.release_after_review }}
    secrets: inherit

  desktop:
    name: Desktop
    needs: meta
    uses: ./.github/workflows/deploy_desktop.yml
    with:
      version_name: ${{ needs.meta.outputs.version_name }}
      version_code: ${{ needs.meta.outputs.version_code }}
      publish_mac_app_store: ${{ inputs.publish_mac_app_store }}
    secrets: inherit

  ios:
    name: iOS
    needs: meta
    uses: ./.github/workflows/deploy_ios.yml
    with:
      version_name: ${{ needs.meta.outputs.version_name }}
      version_code: ${{ needs.meta.outputs.version_code }}
      upload_app_store: ${{ inputs.publish_app_store }}
    secrets: inherit

  # the uploads only add builds to App Store Connect, the version, its notes and the review request are made here
  app_store:
    name: App Store Connect
    needs: [meta, desktop, ios]
    if: ${{ !cancelled() && (needs.ios.outputs.uploaded == 'true' || needs.desktop.outputs.mac_app_store_uploaded == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - name: Install PyJWT
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet 'pyjwt[crypto]'

      - name: Prepare the versions
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          BUNDLE_ID: com.vasmarfas.mobitool
          PLATFORMS: ${{ needs.ios.outputs.uploaded == 'true' && 'IOS' || '' }} ${{ needs.desktop.outputs.mac_app_store_uploaded == 'true' && 'MAC_OS' || '' }}
          VERSION_NAME: ${{ needs.meta.outputs.version_name }}
          BUILD_NUMBER: ${{ needs.meta.outputs.version_code }}
          RELEASE_TYPE: ${{ inputs.release_after_review && 'AFTER_APPROVAL' || 'MANUAL' }}
          SUBMIT: ${{ inputs.submit_for_review }}
          RAW_NOTES_EN: ${{ inputs.notes_en }}
          RAW_NOTES_RU: ${{ inputs.notes_ru }}
        run: |
          NOTES_EN=$(printf '%b' "$RAW_NOTES_EN") NOTES_RU=$(printf '%b' "$RAW_NOTES_RU") \
            "$RUNNER_TEMP/venv/bin/python" .github/scripts/app_store_review.py

  github_release:
    name: GitHub release
    needs: [meta, web, android, desktop, ios]
    if: ${{ !cancelled() && needs.meta.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lh artifacts

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.meta.outputs.version_name }}
          name: v${{ needs.meta.outputs.version_name }}
          target_commitish: ${{ github.sha }}
          body_path: artifacts/notes.md
          generate_release_notes: true
          # a failed platform leaves its files out, so such a release is only drafted
          draft: ${{ inputs.draft || contains(needs.*.result, 'failure') }}
          prerelease: ${{ contains(needs.meta.outputs.version_name, '-') }}
          fail_on_unmatched_files: false
          # the AAB, MSIX with its .cer and the site zip stay in the run artifacts, they are for the stores and the site
          files: |
            artifacts/*.apk
            artifacts/*.msi
            artifacts/*.exe
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.dmg
