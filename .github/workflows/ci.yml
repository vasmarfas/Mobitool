name: CI

on:
  pull_request:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
  # by hand it only links the release framework, the slowest part of the App Store build
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  jvm:
    name: Tests, Android, desktop, web
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # the Linux FFmpeg from JavaCPP links PulseAudio, VA-API, libdrm and XCB, the runner image lacks at least
      # libpulse.so.0 and libva.so.2
      - name: Install FFmpeg runtime libraries
        run: >-
          sudo apt-get update && sudo apt-get install -y --no-install-recommends
          libpulse0 libva2 libva-drm2 libva-x11-2 libvdpau1 libdrm2 libxcb1 libxcb-shm0 libxcb-shape0 libxcb-xfixes0
          libasound2t64

      - name: Unit tests
        run: ./gradlew :shared:jvmTest

      - name: Build Android, desktop and web
        run: ./gradlew :androidApp:assembleDebug :desktopApp:compileKotlin :webApp:wasmJsBrowserDistribution

      # the loader names only the first missing library, ldd lists all of them
      - name: Missing FFmpeg libraries
        if: failure()
        run: ldd ~/.javacpp/cache/*/org/bytedeco/ffmpeg/linux-x86_64/ffmpeg | grep "not found" || true

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: shared/build/reports/tests
          if-no-files-found: ignore

  ios:
    name: iOS framework
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build the app for the simulator
        if: github.event_name != 'workflow_dispatch'
        run: >-
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build/xcode
          CODE_SIGNING_ALLOWED=NO build

      - name: Link the release framework
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -eu
          echo "$(sysctl -n hw.ncpu) cores, $(( $(sysctl -n hw.memsize) / 1048576 ))M memory"
          ( while sleep 300; do echo "$(date -u +%H:%M) $(memory_pressure | tail -n 1), swap $(sysctl -n vm.swapusage)"; done ) &
          sampler=$!
          trap 'kill $sampler' EXIT
          ./gradlew :shared:linkReleaseFrameworkIosArm64
