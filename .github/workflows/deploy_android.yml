name: Deploy Android
run-name: Deploy Android ${{ inputs.version_name }}

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'App versionName (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
      version_code:
        description: 'versionCode (empty = from the version, 1.4.12 is 1041299, 1.4.12-rc2 is 1041202)'
        required: false
        default: ''
      publish_google_play:
        description: 'Publish the AAB to Google Play'
        type: boolean
        default: false
      play_track:
        description: 'Google Play track'
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      play_status:
        description: 'Google Play release status'
        type: choice
        options: [draft, inProgress, completed]
        default: completed
      publish_rustore:
        description: 'Upload the build to a RuStore draft version'
        type: boolean
        default: false
      rustore_artifact:
        description: 'File to upload to RuStore'
        type: choice
        options: [apk, aab]
        default: apk
      rustore_submit:
        description: 'Send the RuStore draft to moderation'
        type: boolean
        default: false
  workflow_call:
    inputs:
      version_name:
        type: string
        required: false
        default: ''
      version_code:
        type: string
        required: false
        default: ''
      publish_google_play:
        type: boolean
        required: false
        default: false
      play_track:
        type: string
        required: false
        default: internal
      play_status:
        type: string
        required: false
        default: completed
      publish_rustore:
        type: boolean
        required: false
        default: false
      rustore_artifact:
        type: string
        required: false
        default: apk
      rustore_submit:
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-android-${{ github.ref }}
  cancel-in-progress: false

env:
  PACKAGE_NAME: com.vasmarfas.mobitool

jobs:
  build:
    name: Build AAB and APK
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.keystore.outputs.signed }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version_name }}
          INPUT_CODE: ${{ inputs.version_code }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -eu
          name="$INPUT_VERSION"
          if [ -z "$name" ]; then
            case "$GITHUB_REF" in
              refs/tags/v*) name="${GITHUB_REF#refs/tags/v}" ;;
              *) name="0.0.0-dev" ;;
            esac
          fi
          derived=$(printf '%s' "$name" | awk '{
            split($0, part, "-")
            split(part[1], v, ".")
            stage = 99
            if (index($0, "-")) { stage = 0; if (match($0, /[0-9]+$/)) stage = substr($0, RSTART) }
            print ((v[1] * 100 + v[2]) * 100 + v[3]) * 100 + stage
          }')
          code="${INPUT_CODE:-$derived}"
          [ "$code" != 0 ] || code="$RUN_NUMBER"
          {
            echo "name=$name"
            echo "code=$code"
          } >> "$GITHUB_OUTPUT"

      - name: Decode keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -eu
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::KEYSTORE_BASE64 is not set, the release build will be unsigned and cannot be published"
          else
            umask 077
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Write Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -eu
          if [ -z "${GOOGLE_SERVICES_JSON:-}" ]; then
            echo "::warning::GOOGLE_SERVICES_JSON is not set, the build will ship without Firebase"
          else
            umask 077
            printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > androidApp/google-services.json
          fi

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APP_VERSION_NAME: ${{ steps.version.outputs.name }}
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: ./gradlew :androidApp:bundleRelease :androidApp:assembleRelease

      - name: Collect artifacts
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -eu
          mkdir -p out mapping
          cp androidApp/build/outputs/bundle/release/*.aab "out/vasmarfas-$VERSION.aab"
          cp androidApp/build/outputs/apk/release/*.apk "out/vasmarfas-$VERSION.apk"
          if [ -f androidApp/build/outputs/mapping/release/mapping.txt ]; then
            cp androidApp/build/outputs/mapping/release/mapping.txt mapping/mapping.txt
          fi

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: out/*
          if-no-files-found: error

      - name: Upload mapping
        uses: actions/upload-artifact@v7
        with:
          name: android-mapping
          path: mapping/*
          if-no-files-found: ignore

  google_play:
    name: Google Play
    needs: build
    if: ${{ inputs.publish_google_play }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check credentials
        id: guard
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          SIGNED: ${{ needs.build.outputs.signed }}
        run: |
          set -eu
          if [ -z "${PLAY_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PLAY_SERVICE_ACCOUNT_JSON is not set, skipping Google Play"
            echo 'Google Play: skipped, PLAY_SERVICE_ACCOUNT_JSON is not set.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$SIGNED" != 'true' ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::the build is unsigned, skipping Google Play"
            echo 'Google Play: skipped, the build is unsigned.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download bundle
        if: steps.guard.outputs.ready == 'true'
        uses: actions/download-artifact@v8
        with:
          name: release-android
          path: out

      - name: Download mapping
        if: steps.guard.outputs.ready == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: android-mapping
          path: mapping

      - name: Prepare release notes
        id: notes
        if: steps.guard.outputs.ready == 'true'
        run: |
          set -eu
          mkdir -p whatsnew
          for dir in store/google-play/*/; do
            [ -f "$dir/whats-new.txt" ] || continue
            cut -c1-500 "$dir/whats-new.txt" > "whatsnew/whatsnew-$(basename "$dir")"
          done
          if [ -z "$(ls -A whatsnew 2>/dev/null)" ]; then
            echo "::notice::no store/google-play listing texts in the repository, publishing without release notes"
          fi
          if [ -f mapping/mapping.txt ]; then
            echo "mapping=mapping/mapping.txt" >> "$GITHUB_OUTPUT"
          else
            echo "mapping=" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to Google Play
        if: steps.guard.outputs.ready == 'true'
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: out/*.aab
          mappingFile: ${{ steps.notes.outputs.mapping }}
          whatsNewDirectory: whatsnew
          track: ${{ inputs.play_track }}
          status: ${{ inputs.play_status }}

  rustore:
    name: RuStore
    needs: build
    if: ${{ inputs.publish_rustore }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check credentials
        id: guard
        env:
          RUSTORE_KEY_ID: ${{ secrets.RUSTORE_KEY_ID }}
          RUSTORE_PRIVATE_KEY: ${{ secrets.RUSTORE_PRIVATE_KEY }}
          SIGNED: ${{ needs.build.outputs.signed }}
        run: |
          set -eu
          if [ -z "${RUSTORE_KEY_ID:-}" ] || [ -z "${RUSTORE_PRIVATE_KEY:-}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::RUSTORE_KEY_ID / RUSTORE_PRIVATE_KEY are not set, skipping RuStore"
            echo 'RuStore: skipped, secrets are not set.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$SIGNED" != 'true' ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::the build is unsigned, skipping RuStore"
            echo 'RuStore: skipped, the build is unsigned.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download build
        if: steps.guard.outputs.ready == 'true'
        uses: actions/download-artifact@v8
        with:
          name: release-android
          path: out

      - name: Upload to RuStore
        if: steps.guard.outputs.ready == 'true'
        env:
          RUSTORE_KEY_ID: ${{ secrets.RUSTORE_KEY_ID }}
          RUSTORE_PRIVATE_KEY: ${{ secrets.RUSTORE_PRIVATE_KEY }}
          ARTIFACT: ${{ inputs.rustore_artifact }}
          SUBMIT: ${{ inputs.rustore_submit }}
        run: |
          set -euo pipefail
          api="https://public-api.rustore.ru"
          key="$RUNNER_TEMP/rustore.pem"
          umask 077
          if printf '%s' "$RUSTORE_PRIVATE_KEY" | grep -q 'BEGIN'; then
            printf '%s\n' "$RUSTORE_PRIVATE_KEY" > "$key"
          else
            {
              echo '-----BEGIN PRIVATE KEY-----'
              printf '%s' "$RUSTORE_PRIVATE_KEY" | tr -d '\r\n ' | fold -w 64
              echo '-----END PRIVATE KEY-----'
            } > "$key"
          fi

          timestamp=$(date +%Y-%m-%dT%H:%M:%S.%3N%:z)
          signature=$(printf '%s' "$RUSTORE_KEY_ID$timestamp" | openssl dgst -sha512 -sign "$key" | openssl base64 -A)
          auth=$(jq -n --arg id "$RUSTORE_KEY_ID" --arg ts "$timestamp" --arg sig "$signature" \
            '{keyId: $id, timestamp: $ts, signature: $sig}')
          session=$(curl -sS -X POST "$api/public/auth/" -H 'Content-Type: application/json' -d "$auth")
          rm -f "$key"
          token=$(jq -r '.body.jwe // ""' <<< "$session")
          if [ -z "$token" ]; then
            echo "::error::RuStore authorization failed: $(jq -c '{code, message}' <<< "$session")"
            exit 1
          fi
          echo "::add-mask::$token"

          base="$api/public/v1/application/$PACKAGE_NAME"
          notes=store/rustore/ru-RU/whats-new.txt
          [ -f "$notes" ] || notes=/dev/null
          draft=$(curl -sS -X POST "$base/version" -H "Public-Token: $token" -H 'Content-Type: application/json' \
            -d "$(jq -n --rawfile notes "$notes" '{publishType: "MANUAL"} + (if $notes == "" then {} else {whatsNew: $notes} end)')")
          if [ "$(jq -r '.code' <<< "$draft")" = 'OK' ]; then
            version_id=$(jq -r '.body' <<< "$draft")
          else
            version_id=$(jq -r '.message // ""' <<< "$draft" | grep -oE '[0-9]{3,}' | tail -n 1 || true)
            if [ -z "$version_id" ]; then
              echo "::error::RuStore draft was not created: $(jq -c '{code, message}' <<< "$draft")"
              exit 1
            fi
            echo "::notice::reusing the existing RuStore draft $version_id"
          fi

          set -- out/*."$ARTIFACT"
          file=$1
          if [ "$ARTIFACT" = 'aab' ]; then
            upload_url="$base/version/$version_id/aab?servicesType=Unknown"
          else
            upload_url="$base/version/$version_id/apk?servicesType=Unknown&isMainApk=true"
          fi
          upload=$(curl -sS -X POST "$upload_url" -H "Public-Token: $token" -F "file=@$file")
          if [ "$(jq -r '.code' <<< "$upload")" != 'OK' ]; then
            echo "::error::RuStore upload failed: $(jq -c '{code, message}' <<< "$upload")"
            exit 1
          fi

          if [ "$SUBMIT" = 'true' ]; then
            commit=$(curl -sS -X POST "$base/version/$version_id/commit?priorityUpdate=5" -H "Public-Token: $token")
            if [ "$(jq -r '.code' <<< "$commit")" != 'OK' ]; then
              echo "::error::RuStore moderation request failed: $(jq -c '{code, message}' <<< "$commit")"
              exit 1
            fi
            echo "RuStore: version $version_id sent to moderation." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "RuStore: version $version_id left as a draft." >> "$GITHUB_STEP_SUMMARY"
          fi
