name: Deploy Android
run-name: Deploy Android ${{ inputs.version_name }}

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'App versionName (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
      version_code:
        description: 'versionCode (empty = from the version, 1.4.12 is 1041299, 1.4.12-rc2 is 1041202)'
        required: false
        default: ''
      notes_en:
        description: 'What''s new in English for Google Play, up to 500 characters, \n is a line break'
        required: false
        default: ''
      notes_ru:
        description: 'Что нового по-русски для Google Play (до 500 знаков) и RuStore, \n — перенос строки'
        required: false
        default: ''
      publish_google_play:
        description: 'Publish the AAB to Google Play'
        type: boolean
        default: false
      play_track:
        description: 'Google Play track'
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      play_status:
        description: 'Google Play release status'
        type: choice
        options: [draft, inProgress, completed]
        default: completed
      play_send_for_review:
        description: 'Send the Google Play changes to review (unchecked = they wait in Publishing overview)'
        type: boolean
        default: false
      publish_rustore:
        description: 'Upload the build to a RuStore draft version'
        type: boolean
        default: false
      rustore_artifact:
        description: 'File to upload to RuStore'
        type: choice
        options: [apk, aab]
        default: apk
      rustore_submit:
        description: 'Send the RuStore draft to moderation'
        type: boolean
        default: false
      rustore_auto_publish:
        description: 'Publish on RuStore as soon as moderation passes'
        type: boolean
        default: false
  workflow_call:
    inputs:
      version_name:
        type: string
        required: false
        default: ''
      version_code:
        type: string
        required: false
        default: ''
      notes_en:
        type: string
        required: false
        default: ''
      notes_ru:
        type: string
        required: false
        default: ''
      publish_google_play:
        type: boolean
        required: false
        default: false
      play_track:
        type: string
        required: false
        default: internal
      play_status:
        type: string
        required: false
        default: completed
      play_send_for_review:
        type: boolean
        required: false
        default: false
      publish_rustore:
        type: boolean
        required: false
        default: false
      rustore_artifact:
        type: string
        required: false
        default: apk
      rustore_submit:
        type: boolean
        required: false
        default: false
      rustore_auto_publish:
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-android-${{ github.ref }}
  cancel-in-progress: false

env:
  PACKAGE_NAME: com.vasmarfas.mobitool

jobs:
  build:
    name: Build AAB and APK
    runs-on: ubuntu-latest
    outputs:
      signed: ${{ steps.keystore.outputs.signed }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version_name }}
          INPUT_CODE: ${{ inputs.version_code }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -eu
          name="$INPUT_VERSION"
          if [ -z "$name" ]; then
            case "$GITHUB_REF" in
              refs/tags/v*) name="${GITHUB_REF#refs/tags/v}" ;;
              *) name="0.0.0-dev" ;;
            esac
          fi
          derived=$(printf '%s' "$name" | awk '{
            split($0, part, "-")
            split(part[1], v, ".")
            stage = 99
            if (index($0, "-")) { stage = 0; if (match($0, /[0-9]+$/)) stage = substr($0, RSTART) }
            print ((v[1] * 100 + v[2]) * 100 + v[3]) * 100 + stage
          }')
          code="${INPUT_CODE:-$derived}"
          [ "$code" != 0 ] || code="$RUN_NUMBER"
          {
            echo "name=$name"
            echo "code=$code"
          } >> "$GITHUB_OUTPUT"

      - name: Decode keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -eu
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::KEYSTORE_BASE64 is not set, the release build will be unsigned and cannot be published"
          else
            umask 077
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Write Firebase config
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set -eu
          if [ -z "${GOOGLE_SERVICES_JSON:-}" ]; then
            echo "::warning::GOOGLE_SERVICES_JSON is not set, the build will ship without Firebase"
          else
            umask 077
            printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > androidApp/google-services.json
          fi

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          APP_VERSION_NAME: ${{ steps.version.outputs.name }}
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
        run: ./gradlew :androidApp:bundleRelease :androidApp:assembleRelease

      - name: Collect artifacts
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -eu
          mkdir -p out mapping
          cp androidApp/build/outputs/bundle/release/*.aab "out/vasmarfas-$VERSION.aab"
          cp androidApp/build/outputs/apk/release/*.apk "out/vasmarfas-$VERSION.apk"
          if [ -f androidApp/build/outputs/mapping/release/mapping.txt ]; then
            cp androidApp/build/outputs/mapping/release/mapping.txt mapping/mapping.txt
          fi

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: out/*
          if-no-files-found: error

      - name: Upload mapping
        uses: actions/upload-artifact@v7
        with:
          name: android-mapping
          path: mapping/*
          if-no-files-found: ignore

  google_play:
    name: Google Play
    needs: build
    if: ${{ inputs.publish_google_play }}
    runs-on: ubuntu-latest
    steps:
      - name: Check credentials
        id: guard
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          SIGNED: ${{ needs.build.outputs.signed }}
        run: |
          set -eu
          if [ -z "${PLAY_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PLAY_SERVICE_ACCOUNT_JSON is not set, skipping Google Play"
            echo 'Google Play: skipped, PLAY_SERVICE_ACCOUNT_JSON is not set.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$SIGNED" != 'true' ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::the build is unsigned, skipping Google Play"
            echo 'Google Play: skipped, the build is unsigned.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download bundle
        if: steps.guard.outputs.ready == 'true'
        uses: actions/download-artifact@v8
        with:
          name: release-android
          path: out

      - name: Download mapping
        if: steps.guard.outputs.ready == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          name: android-mapping
          path: mapping

      - name: Prepare release notes
        id: notes
        if: steps.guard.outputs.ready == 'true'
        env:
          NOTES_EN: ${{ inputs.notes_en }}
          NOTES_RU: ${{ inputs.notes_ru }}
        run: |
          set -eu
          mkdir -p whatsnew
          # dispatch inputs are single-line, \n in them stands for a line break
          [ -z "$NOTES_EN" ] || printf '%b' "$NOTES_EN" > whatsnew/whatsnew-en-US
          [ -z "$NOTES_RU" ] || printf '%b' "$NOTES_RU" > whatsnew/whatsnew-ru-RU
          if [ -z "$(ls -A whatsnew)" ]; then
            echo "::notice::no release notes given, publishing without them"
          fi
          if [ -f mapping/mapping.txt ]; then
            echo "mapping=mapping/mapping.txt" >> "$GITHUB_OUTPUT"
          else
            echo "mapping=" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to Google Play
        if: steps.guard.outputs.ready == 'true'
        uses: r0adkll/upload-google-play@v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: out/*.aab
          mappingFile: ${{ steps.notes.outputs.mapping }}
          whatsNewDirectory: whatsnew
          track: ${{ inputs.play_track }}
          status: ${{ inputs.play_status }}
          changesNotSentForReview: ${{ !inputs.play_send_for_review }}

  rustore:
    name: RuStore
    needs: build
    if: ${{ inputs.publish_rustore }}
    runs-on: ubuntu-latest
    steps:
      - name: Check credentials
        id: guard
        env:
          RUSTORE_KEY_ID: ${{ secrets.RUSTORE_KEY_ID }}
          RUSTORE_PRIVATE_KEY: ${{ secrets.RUSTORE_PRIVATE_KEY }}
          SIGNED: ${{ needs.build.outputs.signed }}
        run: |
          set -eu
          if [ -z "${RUSTORE_KEY_ID:-}" ] || [ -z "${RUSTORE_PRIVATE_KEY:-}" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::RUSTORE_KEY_ID / RUSTORE_PRIVATE_KEY are not set, skipping RuStore"
            echo 'RuStore: skipped, secrets are not set.' >> "$GITHUB_STEP_SUMMARY"
          elif [ "$SIGNED" != 'true' ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::the build is unsigned, skipping RuStore"
            echo 'RuStore: skipped, the build is unsigned.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download build
        if: steps.guard.outputs.ready == 'true'
        uses: actions/download-artifact@v8
        with:
          name: release-android
          path: out

      - name: Upload to RuStore
        if: steps.guard.outputs.ready == 'true'
        env:
          RUSTORE_KEY_ID: ${{ secrets.RUSTORE_KEY_ID }}
          RUSTORE_PRIVATE_KEY: ${{ secrets.RUSTORE_PRIVATE_KEY }}
          ARTIFACT: ${{ inputs.rustore_artifact }}
          SUBMIT: ${{ inputs.rustore_submit }}
          PUBLISH_TYPE: ${{ inputs.rustore_auto_publish && 'INSTANTLY' || 'MANUAL' }}
          NOTES: ${{ inputs.notes_ru || inputs.notes_en }}
        run: |
          set -euo pipefail
          api="https://public-api.rustore.ru"
          key="$RUNNER_TEMP/rustore.pem"
          umask 077
          if printf '%s' "$RUSTORE_PRIVATE_KEY" | grep -q 'BEGIN'; then
            printf '%s\n' "$RUSTORE_PRIVATE_KEY" > "$key"
          else
            {
              echo '-----BEGIN PRIVATE KEY-----'
              printf '%s' "$RUSTORE_PRIVATE_KEY" | tr -d '\r\n ' | fold -w 64
              echo '-----END PRIVATE KEY-----'
            } > "$key"
          fi

          timestamp=$(date +%Y-%m-%dT%H:%M:%S.%3N%:z)
          signature=$(printf '%s' "$RUSTORE_KEY_ID$timestamp" | openssl dgst -sha512 -sign "$key" | openssl base64 -A)
          auth=$(jq -n --arg id "$RUSTORE_KEY_ID" --arg ts "$timestamp" --arg sig "$signature" \
            '{keyId: $id, timestamp: $ts, signature: $sig}')
          session=$(curl -sS -X POST "$api/public/auth/" -H 'Content-Type: application/json' -d "$auth")
          rm -f "$key"
          token=$(jq -r '.body.jwe // ""' <<< "$session")
          if [ -z "$token" ]; then
            echo "::error::RuStore authorization failed: $(jq -c '{code, message}' <<< "$session")"
            exit 1
          fi
          echo "::add-mask::$token"

          base="$api/public/v1/application/$PACKAGE_NAME"
          # dispatch inputs are single-line, \n in them stands for a line break
          whats_new=$(printf '%b' "$NOTES")
          draft=$(curl -sS -X POST "$base/version" -H "Public-Token: $token" -H 'Content-Type: application/json' \
            -d "$(jq -n --arg type "$PUBLISH_TYPE" --arg notes "$whats_new" \
              '{publishType: $type} + (if $notes == "" then {} else {whatsNew: $notes} end)')")
          if [ "$(jq -r '.code' <<< "$draft")" = 'OK' ]; then
            version_id=$(jq -r '.body' <<< "$draft")
          else
            version_id=$(jq -r '.message // ""' <<< "$draft" | grep -oE '[0-9]{3,}' | tail -n 1 || true)
            if [ -z "$version_id" ]; then
              echo "::error::RuStore draft was not created: $(jq -c '{code, message}' <<< "$draft")"
              exit 1
            fi
            echo "::notice::reusing the existing RuStore draft $version_id, its release notes stay as they were"
            # publishType is set when a draft is created, an older draft keeps its own unless the key may change it
            settings=$(curl -sS -X POST "$base/version/$version_id/publish-settings" -H "Public-Token: $token" \
              -H 'Content-Type: application/json' -d "$(jq -n --arg type "$PUBLISH_TYPE" '{publishType: $type}')")
            if [ "$(jq -r '.code' <<< "$settings")" != 'OK' ]; then
              echo "::warning::RuStore kept the draft's publish type: $(jq -c '{code, message}' <<< "$settings")"
            fi
          fi

          set -- out/*."$ARTIFACT"
          file=$1
          if [ "$ARTIFACT" = 'aab' ]; then
            upload_url="$base/version/$version_id/aab?servicesType=Unknown"
          else
            upload_url="$base/version/$version_id/apk?servicesType=Unknown&isMainApk=true"
          fi
          upload=$(curl -sS -X POST "$upload_url" -H "Public-Token: $token" -F "file=@$file")
          if [ "$(jq -r '.code' <<< "$upload")" != 'OK' ]; then
            # a rerun finds the file from the first attempt already in the draft
            if jq -r '.message // ""' <<< "$upload" | grep -qi 'already uploaded'; then
              echo "::notice::the build is already in RuStore draft $version_id"
            else
              echo "::error::RuStore upload failed: $(jq -c '{code, message}' <<< "$upload")"
              exit 1
            fi
          fi

          if [ "$SUBMIT" = 'true' ]; then
            commit=$(curl -sS -X POST "$base/version/$version_id/commit?priorityUpdate=0" -H "Public-Token: $token")
            if [ "$(jq -r '.code' <<< "$commit")" != 'OK' ]; then
              echo "::error::RuStore moderation request failed: $(jq -c '{code, message}' <<< "$commit")"
              exit 1
            fi
            if [ "$PUBLISH_TYPE" = 'INSTANTLY' ]; then
              echo "RuStore: version $version_id sent to moderation, it goes live once approved." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "RuStore: version $version_id sent to moderation, publish it in the console once approved." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "RuStore: version $version_id left as a draft." >> "$GITHUB_STEP_SUMMARY"
          fi
