name: Deploy Desktop
run-name: Deploy Desktop ${{ inputs.version_name }}

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'App versionName (e.g. 1.0.0)'
        required: true
        default: '1.0.0'
      version_code:
        description: 'Build number (empty = from the version, 1.4.12 is 10412)'
        required: false
        default: ''
      build_windows:
        description: 'Windows (MSI, EXE, MSIX)'
        type: boolean
        default: true
      build_linux:
        description: 'Linux (DEB, RPM)'
        type: boolean
        default: true
      build_macos:
        description: 'macOS (DMG, notarized)'
        type: boolean
        default: true
      publish_mac_app_store:
        description: 'Upload the Mac App Store PKG to App Store Connect'
        type: boolean
        default: false
  workflow_call:
    inputs:
      version_name:
        type: string
        required: false
        default: ''
      version_code:
        type: string
        required: false
        default: ''
      build_windows:
        type: boolean
        required: false
        default: true
      build_linux:
        type: boolean
        required: false
        default: true
      build_macos:
        type: boolean
        required: false
        default: true
      publish_mac_app_store:
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows
    if: ${{ inputs.build_windows }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version_name }}
          INPUT_CODE: ${{ inputs.version_code }}
        run: |
          set -eu
          name="$INPUT_VERSION"
          if [ -z "$name" ]; then
            case "$GITHUB_REF" in
              refs/tags/v*) name="${GITHUB_REF#refs/tags/v}" ;;
              *) name="1.0.0" ;;
            esac
          fi
          derived=$(printf '%s' "${name%%-*}" | awk -F. '{ print ($1 * 100 + $2) * 100 + $3 }')
          {
            echo "name=$name"
            echo "package=${name%%-*}"
            echo "code=${INPUT_CODE:-$derived}"
          } >> "$GITHUB_OUTPUT"

      - name: Package
        env:
          APP_VERSION_NAME: ${{ steps.version.outputs.package }}
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
          METRICA_DESKTOP_COUNTER: ${{ secrets.METRICA_DESKTOP_COUNTER }}
          METRICA_DESKTOP_TOKEN: ${{ secrets.METRICA_DESKTOP_TOKEN }}
        run: ./gradlew :desktopApp:packageMsi :desktopApp:packageExe :desktopApp:createDistributable

      - name: Collect artifacts
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -eu
          mkdir -p out
          cp desktopApp/build/compose/binaries/main/msi/*.msi "out/vasmarfas-$VERSION-windows.msi"
          cp desktopApp/build/compose/binaries/main/exe/*.exe "out/vasmarfas-$VERSION-windows-setup.exe"

      - name: Sign installers
        shell: pwsh
        env:
          WINDOWS_PFX_BASE64: ${{ secrets.WINDOWS_PFX_BASE64 }}
          WINDOWS_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrEmpty($env:WINDOWS_PFX_BASE64)) {
            Write-Output "::notice::WINDOWS_PFX_BASE64 is not set, installers stay unsigned"
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_PFX_BASE64))
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe not found' }
          Get-ChildItem out -Include *.msi, *.exe -Recurse | ForEach-Object {
            & $signtool.FullName sign /f $pfx /p $env:WINDOWS_PFX_PASSWORD /fd SHA256 `
              /tr http://timestamp.digicert.com /td SHA256 $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "signing failed for $($_.Name)" }
          }
          Remove-Item $pfx -Force

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: out/*
          if-no-files-found: error

      - name: Package MSIX
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.name }}
          PACKAGE_VERSION: ${{ steps.version.outputs.package }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $kit = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe' |
            Sort-Object FullName -Descending | Select-Object -First 1 | Split-Path
          $root = Join-Path $env:RUNNER_TEMP 'msix'
          Copy-Item desktopApp/msix $root -Recurse
          $manifest = Join-Path $root 'AppxManifest.xml'
          $xml = [xml](Get-Content $manifest -Raw)
          $xml.Package.Identity.Version = "$env:PACKAGE_VERSION.0"
          $xml.Save($manifest)
          # the default config splits resources.pri per scale for bundles, a single package needs one file
          $config = Join-Path $env:RUNNER_TEMP 'priconfig.xml'
          & "$kit\makepri.exe" createconfig /cf $config /dq en-US /pv 10.0.0 /o
          $pri = [xml](Get-Content $config -Raw)
          $null = $pri.resources.RemoveChild($pri.resources.packaging)
          $pri.Save($config)
          & "$kit\makepri.exe" new /pr $root /cf $config /mn $manifest /of (Join-Path $root 'resources.pri') /o
          Copy-Item desktopApp/build/compose/binaries/main/app/Mobitool/* $root -Recurse
          New-Item -ItemType Directory -Force msix | Out-Null
          $package = "msix/vasmarfas-$env:VERSION-windows.msix"
          & "$kit\makeappx.exe" pack /d $root /p $package /o
          $cert = New-SelfSignedCertificate -Type Custom -Subject $xml.Package.Identity.Publisher -KeyUsage DigitalSignature `
            -CertStoreLocation Cert:\CurrentUser\My -TextExtension @('2.5.29.37={text}1.3.6.1.5.5.7.3.3', '2.5.29.19={text}')
          & "$kit\signtool.exe" sign /fd SHA256 /sha1 $cert.Thumbprint $package
          Export-Certificate -Cert $cert -FilePath "msix/vasmarfas-$env:VERSION-windows.cer" | Out-Null

      - name: Upload MSIX
        uses: actions/upload-artifact@v7
        with:
          name: msix-windows
          path: msix/*
          if-no-files-found: error

  linux:
    name: Linux
    if: ${{ inputs.build_linux }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version_name }}
          INPUT_CODE: ${{ inputs.version_code }}
        run: |
          set -eu
          name="$INPUT_VERSION"
          if [ -z "$name" ]; then
            case "$GITHUB_REF" in
              refs/tags/v*) name="${GITHUB_REF#refs/tags/v}" ;;
              *) name="1.0.0" ;;
            esac
          fi
          derived=$(printf '%s' "${name%%-*}" | awk -F. '{ print ($1 * 100 + $2) * 100 + $3 }')
          {
            echo "name=$name"
            echo "package=${name%%-*}"
            echo "code=${INPUT_CODE:-$derived}"
          } >> "$GITHUB_OUTPUT"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Package
        env:
          APP_VERSION_NAME: ${{ steps.version.outputs.package }}
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
          METRICA_DESKTOP_COUNTER: ${{ secrets.METRICA_DESKTOP_COUNTER }}
          METRICA_DESKTOP_TOKEN: ${{ secrets.METRICA_DESKTOP_TOKEN }}
        run: ./gradlew :desktopApp:packageDeb :desktopApp:packageRpm

      - name: Package dependencies
        run: |
          dpkg-deb -f desktopApp/build/compose/binaries/main/deb/*.deb Depends
          rpm -qp --requires desktopApp/build/compose/binaries/main/rpm/*.rpm

      - name: Collect artifacts
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -eu
          mkdir -p out
          cp desktopApp/build/compose/binaries/main/deb/*.deb "out/vasmarfas-$VERSION-linux-amd64.deb"
          cp desktopApp/build/compose/binaries/main/rpm/*.rpm "out/vasmarfas-$VERSION-linux-x86_64.rpm"

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: out/*
          if-no-files-found: error

  macos:
    name: macOS
    if: ${{ inputs.build_macos }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version_name }}
          INPUT_CODE: ${{ inputs.version_code }}
        run: |
          set -eu
          name="$INPUT_VERSION"
          if [ -z "$name" ]; then
            case "$GITHUB_REF" in
              refs/tags/v*) name="${GITHUB_REF#refs/tags/v}" ;;
              *) name="1.0.0" ;;
            esac
          fi
          derived=$(printf '%s' "${name%%-*}" | awk -F. '{ print ($1 * 100 + $2) * 100 + $3 }')
          {
            echo "name=$name"
            echo "package=${name%%-*}"
            echo "code=${INPUT_CODE:-$derived}"
          } >> "$GITHUB_OUTPUT"

      - name: Import signing certificate
        id: certificate
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -eu
          if [ -z "${APPLE_DEVELOPER_ID_P12_BASE64:-}" ]; then
            echo "imported=false" >> "$GITHUB_OUTPUT"
            echo "::notice::APPLE_DEVELOPER_ID_P12_BASE64 is not set, the DMG stays unsigned and is not notarized"
            exit 0
          fi
          umask 077
          keychain="$RUNNER_TEMP/build.keychain-db"
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          printf '%s' "$APPLE_DEVELOPER_ID_P12_BASE64" | tr -d '\n\r ' | openssl base64 -d -A > "$RUNNER_TEMP/developer_id.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/developer_id.p12" -k "$keychain" -P "$APPLE_DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm -f "$RUNNER_TEMP/developer_id.p12"
          echo "imported=true" >> "$GITHUB_OUTPUT"

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Package DMG
        env:
          APP_VERSION_NAME: ${{ steps.version.outputs.package }}
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
          METRICA_DESKTOP_COUNTER: ${{ secrets.METRICA_DESKTOP_COUNTER }}
          METRICA_DESKTOP_TOKEN: ${{ secrets.METRICA_DESKTOP_TOKEN }}
          APPLE_DEVELOPER_ID_IDENTITY: ${{ steps.certificate.outputs.imported == 'true' && secrets.APPLE_DEVELOPER_ID_IDENTITY || '' }}
        run: ./gradlew :desktopApp:packageDmg

      - name: Collect artifacts
        env:
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          set -eu
          mkdir -p out
          cp desktopApp/build/compose/binaries/main/dmg/*.dmg "out/vasmarfas-$VERSION-macos.dmg"

      - name: Notarize
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          SIGNED: ${{ steps.certificate.outputs.imported }}
        run: |
          set -eu
          if [ "$SIGNED" != 'true' ] || [ -z "${ASC_KEY_ID:-}" ] || [ -z "${ASC_ISSUER_ID:-}" ] || [ -z "${ASC_KEY_P8:-}" ]; then
            echo "::notice::ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8 are not set or the build is unsigned, skipping notarization"
            echo 'macOS: DMG is not notarized.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          umask 077
          key="$RUNNER_TEMP/asc_key.p8"
          if printf '%s' "$ASC_KEY_P8" | grep -q 'BEGIN'; then
            printf '%s\n' "$ASC_KEY_P8" > "$key"
          else
            printf '%s' "$ASC_KEY_P8" | tr -d '\n\r ' | openssl base64 -d -A > "$key"
          fi
          trap 'rm -f "$key"' EXIT
          for dmg in out/*.dmg; do
            result=$(xcrun notarytool submit "$dmg" --key "$key" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --wait --output-format json)
            echo "$result"
            if [ "$(jq -r .status <<< "$result")" != 'Accepted' ]; then
              xcrun notarytool log "$(jq -r .id <<< "$result")" --key "$key" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID"
              echo "::error::notarization of $(basename "$dmg") ended with status $(jq -r .status <<< "$result")"
              exit 1
            fi
            xcrun stapler staple "$dmg"
          done

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: out/*
          if-no-files-found: error

      - name: Upload to the Mac App Store
        if: ${{ !cancelled() && inputs.publish_mac_app_store }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APP_VERSION_NAME: ${{ steps.version.outputs.package }}
          APP_VERSION_CODE: ${{ steps.version.outputs.code }}
          METRICA_DESKTOP_COUNTER: ${{ secrets.METRICA_DESKTOP_COUNTER }}
          METRICA_DESKTOP_TOKEN: ${{ secrets.METRICA_DESKTOP_TOKEN }}
          MAC_APP_STORE_IDENTITY: ${{ secrets.MAC_APP_STORE_IDENTITY }}
          MAC_APP_STORE_P12_BASE64: ${{ secrets.MAC_APP_STORE_P12_BASE64 }}
          MAC_APP_STORE_P12_PASSWORD: ${{ secrets.MAC_APP_STORE_P12_PASSWORD }}
          MAC_APP_STORE_PROFILE_BASE64: ${{ secrets.MAC_APP_STORE_PROFILE_BASE64 }}
          MAC_APP_STORE_RUNTIME_PROFILE_BASE64: ${{ secrets.MAC_APP_STORE_RUNTIME_PROFILE_BASE64 }}
        run: |
          set -eu
          for name in MAC_APP_STORE_IDENTITY MAC_APP_STORE_P12_BASE64 MAC_APP_STORE_PROFILE_BASE64 MAC_APP_STORE_RUNTIME_PROFILE_BASE64 ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "$(printenv "$name" || true)" ]; then
              echo "::notice::$name is not set, skipping the Mac App Store"
              echo "Mac App Store: skipped, $name is not set." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          umask 077
          keychain="$RUNNER_TEMP/mas.keychain-db"
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          printf '%s' "$MAC_APP_STORE_P12_BASE64" | tr -d '\n\r ' | openssl base64 -d -A > "$RUNNER_TEMP/mas.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/mas.p12" -k "$keychain" -P "$MAC_APP_STORE_P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm -f "$RUNNER_TEMP/mas.p12"
          printf '%s' "$MAC_APP_STORE_PROFILE_BASE64" | tr -d '\n\r ' | openssl base64 -d -A > desktopApp/macos/embedded.provisionprofile
          printf '%s' "$MAC_APP_STORE_RUNTIME_PROFILE_BASE64" | tr -d '\n\r ' | openssl base64 -d -A > desktopApp/macos/runtime.provisionprofile
          ./gradlew :desktopApp:packagePkg -PmacAppStore -PmacAppStoreIdentity="$MAC_APP_STORE_IDENTITY"
          key="$RUNNER_TEMP/asc_key.p8"
          if printf '%s' "$ASC_KEY_P8" | grep -q 'BEGIN'; then
            printf '%s\n' "$ASC_KEY_P8" > "$key"
          else
            printf '%s' "$ASC_KEY_P8" | tr -d '\n\r ' | openssl base64 -d -A > "$key"
          fi
          mkdir -p ~/.appstoreconnect/private_keys
          cp "$key" ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          for pkg in desktopApp/build/compose/binaries/main/pkg/*.pkg; do
            xcrun altool --upload-app -f "$pkg" -t macos --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          done
          rm -f "$key" ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8

      - name: Remove the temporary keychains
        if: always()
        run: |
          security list-keychains -d user -s login.keychain-db
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true
          security delete-keychain "$RUNNER_TEMP/mas.keychain-db" || true
